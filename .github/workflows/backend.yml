$yaml = @'
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libgeos-dev

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test — import the FastAPI app
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://darukaa:darukaa@localhost:5432/darukaa_test
          JWT_SECRET: test-secret-key-for-ci-only
          CORS_ORIGINS: http://localhost:5173
        run: python -c "from app.main import app; print('App imports OK')"
'@

[System.IO.File]::WriteAllText("$PWD\.github\workflows\backend.yml", $yaml, [System.Text.UTF8Encoding]::new($false))
